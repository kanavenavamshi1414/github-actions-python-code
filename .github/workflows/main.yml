
name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get OIDC Token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("========== OIDC INFORMATION ==========");
            console.log("Issuer:");
            console.log(payload.iss);

            console.log("Audience:");
            console.log(payload.aud);

            console.log("Subject:");
            console.log(payload.sub);

            console.log("Repository:");
            console.log(payload.repository);

            console.log("Repository ID:");
            console.log(payload.repository_id);

            console.log("Repository Owner:");
            console.log(payload.repository_owner);

            console.log("Repository Owner ID:");
            console.log(payload.repository_owner_id);

            console.log("Ref:");
            console.log(payload.ref);

            console.log("======================================");

